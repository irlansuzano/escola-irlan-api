spring.application.name=escola-irlan-api
server.port=8080

# Exemplo de configuração para Produção (usando H2 em arquivo para persistência simples)
spring.datasource.url=jdbc:h2:file:./data/escoladb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=prod_user
spring.datasource.password=prod_pass
spring.jpa.hibernate.ddl-auto=validate

# Desabilita console e logs de SQL em produção por segurança/performance
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
