spring.application.name=escola-irlan-api
server.port=8080

# Configuração para Produção com PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://prod-db-host:5432/escoladb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:prod_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:prod_pass}
spring.jpa.hibernate.ddl-auto=validate

# Desabilita logs de SQL em produção por segurança/performance
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
