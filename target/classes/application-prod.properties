spring.application.name=escola-irlan-api
server.port=8080

# Configuração para Produção com PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://escola-db:5432/escoladb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# Desabilita logs de SQL em produção
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Spring Batch
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# Feign Client URL
biblioteca.service.url=${BIBLIOTECA_SERVICE_URL:http://biblioteca-api:8082}
